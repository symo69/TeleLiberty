name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task to run
        required: false
        default: :TMessagesProj_App:assembleRelease
      publish_release:
        description: Publish a GitHub Release with the APK
        required: false
        type: boolean
        default: false
      release_tag:
        description: Release tag to use when publishing
        required: false
        default: ""
      release_name:
        description: Release name to use when publishing
        required: false
        default: ""
  push:
    branches:
      - master
      - copilot/create-telegram-fork-no-groups-channels
    tags:
      - 'apk-*'
  pull_request:
    branches:
      - master
      - copilot/create-telegram-fork-no-groups-channels

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    outputs:
      should_publish_release: ${{ steps.release-meta.outputs.should_publish_release }}
      release_tag: ${{ steps.release-meta.outputs.release_tag }}
      release_name: ${{ steps.release-meta.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release-meta
        run: |
          SHOULD_PUBLISH_RELEASE="false"
          RELEASE_TAG=""
          RELEASE_NAME=""

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            SHOULD_PUBLISH_RELEASE="true"
            RELEASE_TAG="${{ github.ref_name }}"
            RELEASE_NAME="Telegram APK ${GITHUB_REF_NAME}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" = "true" ]; then
            SHOULD_PUBLISH_RELEASE="true"
            RELEASE_TAG="${{ inputs.release_tag }}"
            RELEASE_NAME="${{ inputs.release_name }}"

            if [ -z "$RELEASE_TAG" ]; then
              RELEASE_TAG="apk-${{ github.run_number }}"
            fi

            if [ -z "$RELEASE_NAME" ]; then
              RELEASE_NAME="Telegram APK ${RELEASE_TAG}"
            fi
          fi

          {
            echo "should_publish_release=$SHOULD_PUBLISH_RELEASE"
            echo "release_tag=$RELEASE_TAG"
            echo "release_name=$RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;35" "build-tools;35.0.0" "ndk;21.4.7075529"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          TASK="${{ inputs.gradle_task }}"
          if [ -z "$TASK" ]; then
            TASK=":TMessagesProj_App:assembleRelease"
          fi

          ./gradlew "$TASK" --stacktrace --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build-apk
    runs-on: ubuntu-latest
    if: needs.build-apk.outputs.should_publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: telegram-apk
          path: release-apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-apk.outputs.release_tag }}
          name: ${{ needs.build-apk.outputs.release_name }}
          files: release-apk/**/*.apk
          fail_on_unmatched_files: true